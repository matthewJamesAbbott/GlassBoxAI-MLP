[package]
name = "glassbox-mlp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Add any necessary dependencies here
# For example, if using ndarray or nalgebra:
# ndarray = "0.15"
# nalgebra = "0.32"
blake3 = { version = "1.0", optional = true }
rand = "0.8"

[dev-dependencies]
kani = "0.27"

[features]
default = []
kani = []
blake3 = ["dep:blake3"]

[[bin]]
name = "mlp-app"
path = "src/main.rs"
