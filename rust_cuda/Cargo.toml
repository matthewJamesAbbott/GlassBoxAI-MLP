[package]
name = "mlp_cuda"
version = "1.0.0"
edition = "2021"
authors = ["Matthew Abbott"]
license = "MIT"
description = "Multi-Layer Perceptron (CUDA/Rust)"

[[bin]]
name = "mlp_cuda"
path = "src/main.rs"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cudarc = { version = "0.12", features = ["driver", "nvrtc", "cuda-version-from-build-system"] }
